exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
#exec-once = ~/.config/hypr/scripts/forcePortalHypr.sh

# Gnome and KDE stuff
exec-once = kdeconnectd
#exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Waybar, wallpapers, notifications, auto-mounting and etc

exec-once = hyprlock --no-fade-in --immediate 0
exec-once = [workspace 1 silent] DRI_PRIME=1 librewolf
exec-once = [workspace special:magic silent] kitty
exec-once = waybar & dunst & udiskie -an
#exec-once = hyprpaper #& nm-applet
exec-once = wlsunset
exec-once = awww-daemon
exec-once = kitten panel --edge=background -o background_opacity=0 cava
exec-once = sleep 1; ~/.config/hypr/scripts/wallpaper-start.sh
