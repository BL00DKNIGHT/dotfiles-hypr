general {
    gaps_in = 2
    gaps_out = 6
    gaps_workspaces = 20
    border_size = 2

    col.active_border = $color4 $color1 $color5 45deg
    col.inactive_border = $color2

    resize_on_border = true 
    allow_tearing = true

    layout = dwindle
}

decoration {
    rounding = 13

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0

    #drop_shadow = true
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)

    blur {
        enabled = true
        ignore_opacity = true
        size = 3                     # Size 3 is the sweetspot imo
        passes = 5
        noise = 0.05
        contrast = 2.0
        brightness = 1.0
        vibrancy = 0.2 #1.1696
        new_optimizations = true
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier, slidefade bottom 20%     # general
    animation = windowsIn, 1, 5, default, popin 60%               # windows open
    animation = windowsOut, 1, 3, default, popin 80%              # windows close
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slidefade bottom 20%
}
